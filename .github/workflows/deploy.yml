name: Auto Deploy Landing Page

on:
  push:
    branches:
      - main # Ganti ke 'master' kalau branch utama lo namanya master

jobs:
  deploy:
    runs-on: self-hosted # Ini wajib biar dia manggil runner di Fedora lo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pindahin File ke Folder Nginx
        run: |
          # Pastikan path ini sesuai dengan folder web lo
          # Kita pake rsync biar cuma update file yang berubah aja
          rsync -avz --delete ./ /var/www/html/landing-page/